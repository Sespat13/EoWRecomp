          assert s.count(a) == 1
          s = s.replace(a, '''    if (pr->fi->uses_gmem_store) {  // (EXP 0.5.30) how many draws store to global memory from a fragment shader
                  static unsigned long nst; static int nl2;
                  nst++;
                  if (nl2 < 12 && ((nst & (nst - 1)) == 0 || nst == 1)) {
