          assert s.count(a) == 1
          s = s.replace(a, '''        {   // (EXP 0.5.19) EOWRECOMP_TEX_SWAP=<fs hash hex>:<i>:<j>: in draws of that fragment shader, texture slot i samples slot j's texture
                      static uint64_t sw_hash = 1;
                      static int sw_i = -1, sw_j = -1;
                      if (sw_hash == 1) {
                          sw_hash = 0;
                          const char *e = getenv("EOWRECOMP_TEX_SWAP");
                          if (e) { char *q; sw_hash = strtoull(e, &q, 16); if (*q == ':') { sw_i = (int)strtol(q + 1, &q, 10); if (*q == ':') sw_j = (int)strtol(q + 1, NULL, 10); } }
                      }
                      int ti = (sw_hash && g_cur_fs_hash == sw_hash && i == sw_i && sw_j >= 0 && sw_j < pr->fi->ntex) ? sw_j : i;
                      texture_info(1, pr->fi, ti, &fii[i], sc, wh);
                  }
                  tex_sc[1][i][0] = sc[0];''')
          open(p, 'w').write(s)
          print('ok texswap')
          EOF16
          sed -i "s/applicationId 'com.eowrecomp.android'/applicationId 'com.eowrecomp.android.exp'/" android/app/build.gradle
          sed -i 's|<string name="app_name">EoW Recomp</string>|<string name="app_name">EoWRecomp 0.5 Exp</string>|' android/app/src/main/res/values/strings.xml
          git diff --stat
          grep -n "applicationId" android/app/build.gradle
          grep -n "romfs_file_find" runtime/hle/movie.c runtime/services/fs.c
          grep -n "have12" runtime/nvn/vulkan/device.c
          grep -n "EXP" runtime/nvn/vulkan/exec.c runtime/nvn/maxwell/translate.c

      - name: Clave de firma fija (para poder actualizar encima)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5

      - name: Dependencias nativas (FFmpeg, shaderc, etc.)
        run: tools/android/build_deps.sh

      - name: Compilar la APK
        working-directory: android
        run: ./gradlew assembleRelease -PonDeviceBuild=true -PeowVersionName=0.5.19-experimental -PeowVersionCode=24 -x eowOnDeviceAssets

      - name: Mostrar la huella de la firma
        continue-on-error: true
        run: |
          APK=$(find android -name '*.apk' -path '*release*' | head -1)
          echo "$APK"
          $(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner verify --print-certs "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: EoWRecomp-0.5-Experimental-apk
          path: android/app/build/outputs/apk/release/*.apk
