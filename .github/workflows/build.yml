name: EoWRecomp 0.5 Experimental
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm cmake python3 zip unzip

      - name: Android SDK y NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Descargar la APK original del release y comprobarla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/orig
          gh release download alpha_1 --repo Nycolazs/EoWRecomp --pattern 'EoWRecomp-alpha_1-Android-arm64.apk' --output build/orig/eow.apk
          echo "8d7a0d38f710fbd6d294eacd5f0e67d7925a7332c365aa04a81945989dafba0a  build/orig/eow.apk" | sha256sum -c -

      - name: Reutilizar las piezas ya compiladas de la APK original
        run: |
          unzip -q build/orig/eow.apk 'lib/arm64-v8a/*' 'assets/ondevice.zip' 'assets/licenses/*' -d build/orig/x
          mkdir -p build/ondevice/stage/jniLibs/arm64-v8a build/ondevice/assets
          for f in libzig libpython3.14 libunicorn libcapstone libeowpython; do
            cp build/orig/x/lib/arm64-v8a/$f.so build/ondevice/stage/jniLibs/arm64-v8a/
          done
          cp build/orig/x/assets/ondevice.zip build/ondevice/assets/
          cp -R build/orig/x/assets/licenses build/ondevice/assets/
          ls -l build/ondevice/stage/jniLibs/arm64-v8a build/ondevice/assets

      - name: Aplicar los cambios experimentales
        run: |
          python3 - <<'EOF'
          p = 'runtime/nvn/vulkan/device.c'
          s = open(p).read()
          a = '    VkPhysicalDeviceFeatures2 have = {.sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_FEATURES_2};\n'
          b = ('    VkPhysicalDeviceVulkan12Features have12 = {.sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_VULKAN_1_2_FEATURES};\n'
               '    VkPhysicalDeviceFeatures2 have = {.sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_FEATURES_2, .pNext = &have12};\n')
          assert s.count(a) == 1, 'bloque 1 no encontrado'
          s = s.replace(a, b)
          c = '    vkGetPhysicalDeviceFeatures2(g_vk.phys, &have);\n'
          d = c + '    if (!have12.uniformAndStorageBuffer8BitAccess) LOG("[vk] warning: no uniformAndStorageBuffer8BitAccess (not requested)\\n");\n'
          assert s.count(c) == 1, 'bloque 2 no encontrado'
          s = s.replace(c, d)
          e = '.uniformAndStorageBuffer8BitAccess = VK_TRUE, .storageBuffer8BitAccess = VK_TRUE,'
          f = '.uniformAndStorageBuffer8BitAccess = have12.uniformAndStorageBuffer8BitAccess, .storageBuffer8BitAccess = VK_TRUE,'
          assert s.count(e) == 1, 'bloque 3 no encontrado'
          s = s.replace(e, f)
          open(p, 'w').write(s)
          EOF
          python3 - <<'EOF2'
          p = 'runtime/nvn/vulkan/exec.c'
          s = open(p).read()
          def rep(a, b):
              global s
              assert s.count(a) == 1, 'no encontrado (o repetido): ' + a[:60]
              s = s.replace(a, b)

          # 1) copia activa tambien sin la importacion de memoria del anfitrion
          rep('on = e ? atoi(e) != 0 : g_vk.props.deviceType == VK_PHYSICAL_DEVICE_TYPE_DISCRETE_GPU;',
              'on = e ? atoi(e) != 0 : (g_vk.props.deviceType == VK_PHYSICAL_DEVICE_TYPE_DISCRETE_GPU || !g_vk.host_import);')

          # 2) origen de la copia: el monton del juego en la CPU cuando no hay importacion
          rep('    if (!on || !gmem_buf) return;\n',
              '    bool cpu_src = !gmem_buf && !g_vk.host_import;  // (EXP) sin VK_EXT_external_memory_host: leer el monton desde la CPU\n'
              '    uint64_t gsz = gmem_size;\n'
              '    if (cpu_src) { gsz = (kernel_heap_size() + 0xFFFF) & ~0xFFFFull; if (gsz > HEAP_MAX) gsz = HEAP_MAX; }\n'
              '    if (!on || (!gmem_buf && !cpu_src)) return;\n')
          rep('if (!a || !sz || a < HEAP_BASE || a - HEAP_BASE + sz > gmem_size) continue;',
              'if (!a || !sz || a < HEAP_BASE || a - HEAP_BASE + sz > gsz) continue;')
          rep('        if (hi > gmem_size) hi = gmem_size;\n        int k = n++;',
              '        if (hi > gsz) hi = gsz;\n        int k = n++;')
          rep('    vkCmdCopyBuffer(cb, gmem_buf, gfast_buf, (uint32_t)m, cp);\n',
              '    if (cpu_src) {\n'
              '        for (int i = 0; i < m; i++) {\n'
              '            VkSpan gs = guest_copy(HEAP_BASE + cp[i].srcOffset, cp[i].size);\n'
              '            VkBufferCopy one = {gs.off, cp[i].dstOffset, cp[i].size};\n'
              '            vkCmdCopyBuffer(cb, gs.buf, gfast_buf, 1, &one);\n'
              '        }\n'
              '    } else {\n'
              '        vkCmdCopyBuffer(cb, gmem_buf, gfast_buf, (uint32_t)m, cp);\n'
              '    }\n')

          # 3) sin importacion no hay vuelta a la memoria del juego (etapa 1: solo lectura)
          rep('    if (!gfast_n) return;\n    VkBufferCopy back[GMAP_MAX];',
              '    if (!gfast_n) return;\n'
              '    if (!gmem_buf) {  // (EXP) etapa 2: sin importacion, la vuelta al monton pasa por la CPU\n'
              '        uint64_t tot = 0;\n'
              '        for (int i = 0; i < gfast_n; i++) tot += (gfast_cp[i].size + 255) & ~255ull;\n'
              '        VkSpan out = vk_readback(tot);\n'
              '        VkBufferCopy rb[GMAP_MAX];\n'
              '        uint64_t o = 0;\n'
              '        for (int i = 0; i < gfast_n; i++) { rb[i] = (VkBufferCopy){gfast_cp[i].dstOffset, out.off + o, gfast_cp[i].size}; o += (gfast_cp[i].size + 255) & ~255ull; }\n'
              '        vk_full_barrier(cb);\n'
              '        vkCmdCopyBuffer(cb, gfast_buf, out.buf, (uint32_t)gfast_n, rb);\n'
              '        wait_why = "gfast write-back";\n'
              '        renderer_flush();\n'
              '        o = 0;\n'
              '        for (int i = 0; i < gfast_n; i++) { memcpy((void *)(uintptr_t)(HEAP_BASE + gfast_cp[i].srcOffset), (uint8_t *)out.ptr + o, gfast_cp[i].size); o += (gfast_cp[i].size + 255) & ~255ull; }\n'
              '        gfast_n = 0;\n'
              '        return;\n'
              '    }\n'
              '    VkBufferCopy back[GMAP_MAX];')
          open(p, 'w').write(s)
          print('ok')
          EOF2
          python3 - <<'EOF3'
          p = 'runtime/nvn/maxwell/translate.c'
          s = open(p).read()
          a = '    } else {\n        fail(c, "unknown instruction %016llx at %#x", (unsigned long long)w, pc);\n'
          assert s.count(a) == 1, 'ancla SUST no encontrada'
          b = ('    } else if (OPM(0xeb20000000000000ull, 0xffe0000000000000ull)) {  // SUST (EXP: no-op, sin escritura de imagen)\n'
               '        sp(&c->body, "    /* sust: not implemented (EXP no-op) */\\n");\n')
          s = s.replace(a, b + a)
          open(p, 'w').write(s)
          print('ok sust')
          EOF3
          python3 - <<'EOF4'
          p = 'android/app/build.gradle'
          s = open(p).read()
          a = "    signingConfigs {\n        if (keystoreProps.exists()) {\n"
          assert s.count(a) == 1, 'ancla signingConfigs no encontrada'
          b = ("    signingConfigs {\n"
               "        eowfixed {\n"
               "            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')\n"
               "            storePassword 'android'\n"
               "            keyAlias 'androiddebugkey'\n"
               "            keyPassword 'android'\n"
               "        }\n"
               "        if (keystoreProps.exists()) {\n")
          s = s.replace(a, b)
          c = "signingConfig keystoreProps.exists() ? signingConfigs.release : signingConfigs.debug"
          assert s.count(c) == 1, 'ancla signingConfig no encontrada'
          s = s.replace(c, "signingConfig keystoreProps.exists() ? signingConfigs.release : signingConfigs.eowfixed")
          open(p, 'w').write(s)
          print('ok firma fija')
          EOF4
          python3 - <<'EOF5'
          # Parche 0.5.6: el video del titulo se lee desde el paquete (romfs) cuando no existe como archivo suelto
          p = 'runtime/services/fs.c'
          s = open(p).read()
          a = '// ------------------------------------------------------------------ IStorage (raw RomFS image)\n'
          b = '''// A RomFS file by path ("region_common/movie/x.webm"): image offset and size (-1 if unknown). For code that needs
          // a file but has no host copy because the RomFS is read in place from the package (the movie decoder).
          int64_t romfs_file_find(const char *rel, uint64_t *off) {
              for (int i = 0; i < rom_nfiles; i++)
                  if (!strcmp(rom_files[i].path, rel)) { *off = rom_files[i].off; return (int64_t)rom_files[i].size; }
              return -1;
          }

          ssize_t romfs_image_read(uint64_t off, void *dst, size_t n) {
              return romfs_fd < 0 ? -1 : romfs_read(romfs_fd, dst, n, off);
          }

          '''
          assert s.count(a) == 1, 'fs.c ancla no encontrada'
          s = s.replace(a, b + a)
          open(p, 'w').write(s)

          p = 'runtime/hle/movie.c'
          s = open(p).read()
          a = 'static void ex_set_data_source(Cpu *c) {\n'
          b = '''// RomFS read in place from the package: no host file exists, so FFmpeg reads the movie through this.
          int64_t romfs_file_find(const char *rel, uint64_t *off);
          ssize_t romfs_image_read(uint64_t off, void *dst, size_t n);
          typedef struct { uint64_t off, size, pos; } RomIO;
          static int romio_read(void *o, uint8_t *buf, int n) {
              RomIO *r = o;
              if (r->pos >= r->size) return AVERROR_EOF;
              if ((uint64_t)n > r->size - r->pos) n = (int)(r->size - r->pos);
              ssize_t k = romfs_image_read(r->off + r->pos, buf, (size_t)n);
              if (k <= 0) return AVERROR_EOF;
              r->pos += (uint64_t)k;
              return (int)k;
          }
          static int64_t romio_seek(void *o, int64_t off, int whence) {
              RomIO *r = o;
              if (whence == AVSEEK_SIZE) return (int64_t)r->size;
              whence &= ~AVSEEK_FORCE;
              int64_t p = whence == SEEK_SET ? off : whence == SEEK_CUR ? (int64_t)r->pos + off : (int64_t)r->size + off;
              if (p < 0) return -1;
              r->pos = (uint64_t)p;
              return p;
          }

          '''
          assert s.count(a) == 1, 'movie.c ancla 1 no encontrada'
          s = s.replace(a, b + a)
          a = '    if (avformat_open_input(&e->fmt, host, NULL, NULL) < 0 || avformat_find_stream_info(e->fmt, NULL) < 0) {\n'
          b = '''    int rc = avformat_open_input(&e->fmt, host, NULL, NULL);
              if (rc < 0) {
                  uint64_t roff = 0;
                  int64_t rsz = rel ? romfs_file_find(rel, &roff) : -1;
                  if (rsz >= 0) {
                      RomIO *r = calloc(1, sizeof *r);
                      r->off = roff, r->size = (uint64_t)rsz;
                      AVIOContext *io = avio_alloc_context(av_malloc(65536), 65536, 0, r, romio_read, NULL, romio_seek);
                      e->fmt = avformat_alloc_context();
                      e->fmt->pb = io;
                      e->fmt->flags |= AVFMT_FLAG_CUSTOM_IO;
                      rc = avformat_open_input(&e->fmt, host, NULL, NULL);
                      LOG("[movie] from the package (%lld bytes): %s\\n", (long long)rsz, rc < 0 ? "failed" : "ok");
                  }
              }
              if (rc < 0 || avformat_find_stream_info(e->fmt, NULL) < 0) {
          '''
          assert s.count(a) == 1, 'movie.c ancla 2 no encontrada'
          s = s.replace(a, b)
          open(p, 'w').write(s)
          EOF5
          python3 - <<'EOF6'
          # Parche 0.5.7: diagnostico de memoria global (gmem) sin importar el heap. No cambia el comportamiento: solo escribe al log.
          p = 'runtime/nvn/vulkan/exec.c'
          s = open(p).read()

          # 1) gfast_prepare: avisa cuando un dispatch no puede usar la copia y cae al heap (que sin import lee ceros)
          a = '        if (m > GMAP_MAX || off + len > GFAST_SIZE) return;  // (too much: the heap as before)\n'
          b = ('        if (m > GMAP_MAX || off + len > GFAST_SIZE) {  // (too much: the heap as before)\n'
               '            static int nl; if (!g_vk.host_import && nl++ < 30) LOG("[gmem] cs %llx: too many/large ranges (%d ranges, %llu KB): reads give zero\\n", (unsigned long long)st.program->stages[5].code_addr, m, (unsigned long long)((off + len) >> 10));\n'
               '            return;\n'
               '        }\n')
          assert s.count(a) == 1, 'diag ancla 1'
          s = s.replace(a, b)

          a = '    if (!m) return;\n'
          assert s.count(a) >= 1, 'diag ancla 2'
          i = s.index(a, s.index('static void gfast_prepare'))
          b = ('    if (!m) {\n'
               '        static int nl; if (!g_vk.host_import && nl++ < 30) LOG("[gmem] cs %llx: no bound storage buffer inside the heap: reads give zero\\n", (unsigned long long)st.program->stages[5].code_addr);\n'
               '        return;\n'
               '    }\n')
          s = s[:i] + b + s[i + len(a):]

          # 2) dibujos (vertex/fragment) que usan gmem sin import: leen ceros
          a = '    if (pr->vi->uses_gmem_store) vc_mark_sbufs(0);\n'
          b = ('    if (!gmem_buf && (pr->vi->uses_gmem || pr->fi->uses_gmem)) {  // (diagnostic) graphics shaders reading the heap with no import\n'
               '        static uint64_t seen[64][2]; static int nseen; static unsigned long ndraw;\n'
               '        ndraw++;\n'
               '        int k = 0; while (k < nseen && !(seen[k][0] == (uint64_t)pr->code[0] && seen[k][1] == (uint64_t)pr->code[1])) k++;\n'
               '        if (k == nseen && nseen < 64) {\n'
               '            seen[nseen][0] = (uint64_t)pr->code[0]; seen[nseen][1] = (uint64_t)pr->code[1]; nseen++;\n'
               '            LOG("[gmem] draw: vs %llx (gmem %d store %d) fs %llx (gmem %d store %d) reads zero; sbuf v:",\n'
               '                (unsigned long long)pr->code[0], pr->vi->uses_gmem, pr->vi->uses_gmem_store, (unsigned long long)pr->code[1], pr->fi->uses_gmem, pr->fi->uses_gmem_store);\n'
               '            for (int i = 0; i < 16; i++) if (st.sbuf[0][i].addr) LOG(" %llx+%llx", (unsigned long long)st.sbuf[0][i].addr, (unsigned long long)st.sbuf[0][i].size);\n'
               '            LOG(" f:");\n'
               '            for (int i = 0; i < 16; i++) if (st.sbuf[1][i].addr) LOG(" %llx+%llx", (unsigned long long)st.sbuf[1][i].addr, (unsigned long long)st.sbuf[1][i].size);\n'
               '            LOG(" (unique %d, draws so far %lu)\\n", nseen, ndraw);\n'
               '        }\n'
               '    }\n') + a
          assert s.count(a) == 1, 'diag ancla 3'
          s = s.replace(a, b)

          # 3) resumen cada ~2000 dibujos de este tipo
          a = '        ndraw++;\n'
          b = '        ndraw++;\n        if ((ndraw & (ndraw - 1)) == 0 && ndraw >= 1024) LOG("[gmem] %lu draws with graphics gmem so far\\n", ndraw);\n'
          assert s.count(a) == 1, 'diag ancla 4'
          s = s.replace(a, b)
          open(p, 'w').write(s)
          print('ok diag')
          EOF6
          python3 - <<'EOF7'
          # Parche 0.5.8 (EXP): los shaders de dibujo (vertex/fragment) leen sus buffers de almacenamiento desde una copia hecha por la CPU
          # cuando la GPU no puede importar el monton (sin VK_EXT_external_memory_host). EOWRECOMP_VK_GFX_GMAP=1 lo enciende (apagado por defecto desde 0.5.9).
          import re
          p = 'runtime/nvn/maxwell/translate.c'
          s = open(p).read()
          a = 'uint64_t maxwell_gmem_base, maxwell_gmem_size;'
          assert s.count(a) == 1
          s = s.replace(a, a + '\nbool maxwell_gfx_gmap;  // (EXP) graphics shaders look their gmem loads up in GMap / GFast too (exec.c gfx_gmap)')
          a = '        if (c->glsl && c->stage == STAGE_COMPUTE) {\n            // Compute (Vulkan): the guest heap is host memory'
          assert s.count(a) == 1
          s = s.replace(a, '        if (c->glsl && (c->stage == STAGE_COMPUTE || (maxwell_gfx_gmap && !store))) {\n            // Compute (Vulkan): the guest heap is host memory')
          a = '''        sp(&s, "layout(std430, set = %d, binding = %d) %sbuffer GFast { uint w[]; } gfast_;\\n", set, GFAST_BUFFER_INDEX,
                     c->uses_gmem_store ? "" : "readonly ");'''
          assert s.count(a) == 1
          s = s.replace(a, '''        sp(&s, "layout(std430, set = %d, binding = %d) %sbuffer GFast { uint w[]; } gfast_;\\n", set, GFAST_BUFFER_INDEX,
                     c->uses_gmem_store && stage == STAGE_COMPUTE ? "" : "readonly ");''')
          open(p, 'w').write(s)

          p = 'runtime/nvn/maxwell/shader.h'
          s = open(p).read()
          a = '#define GMAP_BUFFER_INDEX 20'
          assert s.count(a) == 1
          s = s.replace(a, 'extern bool maxwell_gfx_gmap;\n' + a)
          open(p, 'w').write(s)

          p = 'runtime/nvn/vulkan/exec.c'
          s = open(p).read()
          # 1) flag antes de traducir
          a = '    maxwell_gmem_base = HEAP_BASE;\n    maxwell_gmem_size = HEAP_MAX;\n    pthread_mutex_lock(&translate_lock);\n    p->vi = maxwell_translate('
          assert s.count(a) == 1
          s = s.replace(a, '''    maxwell_gmem_base = HEAP_BASE;
              maxwell_gmem_size = HEAP_MAX;
              { const char *e = getenv("EOWRECOMP_VK_GFX_GMAP"); maxwell_gfx_gmap = e ? atoi(e) != 0 : 0;  /* 0.5.9: apagado por defecto (0.5.8 no cambio la imagen) */ }
              pthread_mutex_lock(&translate_lock);
              p->vi = maxwell_translate(''')
          # 2) funcion gfx_gmap antes de stage_set
          a = 'static VkDescriptorSet stage_set(Prog *p, VkDescriptorSetLayout layout,'
          assert s.count(a) == 1
          fn = r'''// (EXP) Sin importar el monton, un shader de dibujo que lee memoria global (LDG) veia ceros. Sus buffers de almacenamiento
          // (st.sbuf[stage]) se copian desde la CPU a memoria transitoria (compartida por envio si no cambian) y la tabla GMap dice donde
          // cae cada rango, igual que gfast_prepare en compute. Solo lecturas: los STG de dibujo siguen yendo al buffer ficticio.
          static bool gfx_gmap(int stage, uint32_t *tab, VkDescriptorBufferInfo *out) {
              static struct { uint64_t seq; uint32_t tab[(GMAP_MAX + 1) * 4]; VkSpan span; uint64_t total; } last[2];
              memset(tab, 0, (GMAP_MAX + 1) * 4 * sizeof(uint32_t));
              uint64_t gsz = (kernel_heap_size() + 0xFFFF) & ~0xFFFFull;
              if (gsz > HEAP_MAX) gsz = HEAP_MAX;
              struct { uint64_t lo, hi; } r[16];
              int n = 0;
              for (int i = 0; i < 16; i++) {
                  uint64_t a = st.sbuf[stage][i].addr, sz = st.sbuf[stage][i].size;
                  if (!a || !sz || a < HEAP_BASE || a - HEAP_BASE + sz > gsz) continue;
                  uint64_t lo = (a - HEAP_BASE) & ~255ull, hi = (a - HEAP_BASE + sz + 255) & ~255ull;
                  if (hi > gsz) hi = gsz;
                  int k = n++;
                  while (k > 0 && r[k - 1].lo > lo) { r[k] = r[k - 1]; k--; }
                  r[k].lo = lo; r[k].hi = hi;
              }
              int m = 0;
              for (int i = 0; i < n; i++) {
                  if (m && r[i].lo <= r[m - 1].hi + 4096) { if (r[i].hi > r[m - 1].hi) r[m - 1].hi = r[i].hi; }
                  else r[m++] = r[i];
              }
              uint64_t total = 0;
              for (int i = 0; i < m; i++) total += (r[i].hi - r[i].lo + 255) & ~255ull;
              if (!m || m > GMAP_MAX || total > (4ull << 20)) {
                  static int nl;
                  if (m && nl++ < 20) LOG("[gmem] draw stage %d: %d ranges, %llu KB: too much to copy, reads give zero\n", stage, m, (unsigned long long)(total >> 10));
                  memset(tab, 0, (GMAP_MAX + 1) * 4 * sizeof(uint32_t));
                  *out = gmem_info();
                  return false;
              }
              uint64_t off = 0;
              for (int i = 0; i < m; i++) {
                  uint64_t len = r[i].hi - r[i].lo;
                  tab[i * 4 + 0] = (uint32_t)r[i].lo;
                  tab[i * 4 + 1] = (uint32_t)len;
                  tab[i * 4 + 2] = (uint32_t)(off >> 2);
                  off += (len + 255) & ~255ull;
              }
              tab[GMAP_MAX * 4] = (uint32_t)m;
              int sl = stage ? 1 : 0;
              uint64_t seq = vk_pending_seq() + (gcopy_gen << 40);
              if (last[sl].seq != seq || last[sl].total != total || memcmp(last[sl].tab, tab, sizeof last[sl].tab)) {
                  VkSpan sp_ = vk_transient(total, 256);
                  off = 0;
                  for (int i = 0; i < m; i++) {
                      uint64_t len = r[i].hi - r[i].lo;
                      memcpy((uint8_t *)sp_.ptr + off, (const void *)(uintptr_t)(HEAP_BASE + r[i].lo), len);
                      off += (len + 255) & ~255ull;
                  }
                  last[sl].seq = seq; last[sl].total = total; last[sl].span = sp_;
                  memcpy(last[sl].tab, tab, sizeof last[sl].tab);
                  static unsigned long cnt;
                  if (cnt++ < 5) LOG("[gmem] draw stage %d: %d ranges, %llu KB copied for shader reads\n", stage, m, (unsigned long long)(total >> 10));
              }
              *out = (VkDescriptorBufferInfo){last[sl].span.buf, last[sl].span.off, total};
              return true;
          }

          '''
          s = s.replace(a, fn + a)
          # 3) stage_set: preparar y usar
          a = '    int sg = stage == 1 ? 1 : 0;\n    float rs[66][4] = {{1, 1, 0, 0}};'
          assert s.count(a) == 1
          s = s.replace(a, '''    int sg = stage == 1 ? 1 : 0;
              uint32_t gtab[(GMAP_MAX + 1) * 4];
